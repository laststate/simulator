name: Package cleanup
# Keeps GHCR from growing without bound: untagged/sha-only images older
# than the keep window are deleted. Tagged releases are never touched.
on:
  schedule:
    - cron: '47 3 * * 0'
  workflow_dispatch:
permissions:
  packages: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/delete-package-versions@v5.0.0
        with:
          package-name: simulator
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
